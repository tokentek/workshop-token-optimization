<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake (reference)</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1b2a; color: #e0e1dd; font: 16px/1.4 system-ui, sans-serif; }
  .wrap { text-align: center; }
  .hud { display: flex; justify-content: space-between; margin-bottom: 8px; }
  canvas { background: #1b263b; border: 2px solid #415a77; image-rendering: pixelated; }
  .msg { height: 1.6em; margin-top: 8px; font-weight: 700; color: #ffb703; }
  .help { opacity: .7; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Score: <b id="score">0</b></span><span>High score: <b id="high">0</b></span></div>
  <canvas id="board" width="400" height="400"></canvas>
  <div class="msg" id="msg"></div>
  <div class="help">Arrow keys or WASD to steer. Space or Enter for a new game.</div>
</div>
<script>
(() => {
  // Reference build of SNAKE-01 to SNAKE-06. Presenter use only. SNAKE-07 (pause) is left out on purpose.
  const N = 20, CELL = 20, START_TICK = 150, STEP = 15, MIN_TICK = 60;
  const HIGH_KEY = "lighthouse.snake.highscore";
  const ctx = document.getElementById("board").getContext("2d");
  const scoreEl = document.getElementById("score");
  const highEl = document.getElementById("high");
  const msgEl = document.getElementById("msg");
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };

  let snake, dir, queued, food, score, eaten, tick, timer, over;
  let high = Number(localStorage.getItem(HIGH_KEY)) || 0;
  highEl.textContent = high;

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      if (!snake.some(p => p.x === x && p.y === y)) free.push({ x, y });
    }
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function newGame() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = [1, 0]; queued = null; score = 0; eaten = 0; tick = START_TICK; over = false;
    food = placeFood();
    scoreEl.textContent = score; msgEl.textContent = "";
    restartTimer(); draw();
  }

  function restartTimer() { clearInterval(timer); timer = setInterval(step, tick); }

  function step() {
    if (queued) { dir = queued; queued = null; }
    const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
    const grows = food && head.x === food.x && head.y === food.y;
    const body = grows ? snake : snake.slice(0, -1);
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some(p => p.x === head.x && p.y === head.y)) {
      return endGame();
    }
    snake.unshift(head);
    if (grows) {
      score++; eaten++; scoreEl.textContent = score;
      food = placeFood();
      if (eaten % 5 === 0 && tick > MIN_TICK) { tick = Math.max(MIN_TICK, tick - STEP); restartTimer(); }
    } else {
      snake.pop();
    }
    draw();
  }

  function endGame() {
    clearInterval(timer); over = true;
    if (score > high) { high = score; localStorage.setItem(HIGH_KEY, String(high)); highEl.textContent = high; }
    msgEl.textContent = "Game over";
  }

  function draw() {
    ctx.clearRect(0, 0, N * CELL, N * CELL);
    if (food) { ctx.fillStyle = "#ffb703"; ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6); }
    snake.forEach((p, i) => {
      ctx.fillStyle = i === 0 ? "#8ecae6" : "#219ebc";
      ctx.fillRect(p.x * CELL + 1, p.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  document.addEventListener("keydown", e => {
    if (over && (e.key === " " || e.key === "Enter")) { e.preventDefault(); return newGame(); }
    const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
    if (!k || over) return;
    e.preventDefault();
    if (queued) return;                              // first valid key per tick wins
    if (k[0] === -dir[0] && k[1] === -dir[1]) return; // no turn back into itself
    queued = k;
  });

  newGame();
})();
</script>
</body>
</html>
