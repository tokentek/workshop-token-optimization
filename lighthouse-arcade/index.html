<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse Arcade</title>
<style>
  :root { --navy: #0d1b2a; --dusk: #1b263b; --slate: #415a77; --paper: #e0e1dd; --amber: #ffb703; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--navy); color: var(--paper); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 4px; font-size: 40px; color: var(--amber); letter-spacing: .02em; }
  p { margin: 0 0 24px; opacity: .85; }
  ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  a.card { display: block; padding: 20px; border: 2px solid var(--slate); border-radius: 8px; background: var(--dusk); color: inherit; text-decoration: none; }
  a.card:hover, a.card:focus { border-color: var(--amber); outline: none; }
  .name { font-size: 20px; font-weight: 700; }
  .note { font-size: 14px; opacity: .75; }
</style>
</head>
<body>
<main>
  <h1>Lighthouse Arcade</h1>
  <p>Small browser games. Each game is one HTML file. Open it with a double click. All code is fictional.</p>
  <ul>
    <li><a class="card" href="games/snake/index.html"><span class="name">Snake</span><br><span class="note">Stories SNAKE-01 to SNAKE-08. In Lab 2, Claude builds this game here, in one file.</span></a></li>
  </ul>
</main>
</body>
</html>
